name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      CAPABILITIES_CONTRACT_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The library refuses a store reached without TLS, so the service container is
      # given a self-signed certificate and a pg_hba.conf that refuses plain text over
      # TCP, the same server the local fixture starts with initdb.
      - name: Turn on TLS in the service container
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          openssl req -new -x509 -days 2 -nodes -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.crt"
          docker cp "$RUNNER_TEMP/server.crt" "$CONTAINER:/tmp/server.crt"
          docker cp "$RUNNER_TEMP/server.key" "$CONTAINER:/tmp/server.key"
          docker exec "$CONTAINER" sh -c 'chown postgres /tmp/server.crt /tmp/server.key && chmod 600 /tmp/server.key'
          docker exec "$CONTAINER" sh -c 'sed -i "s/^host all all all/hostssl all all all/" "$PGDATA/pg_hba.conf" && printf "hostnossl all all all reject\n" >> "$PGDATA/pg_hba.conf"'
          docker exec -u postgres "$CONTAINER" psql -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/tmp/server.key'" -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
          sleep 1
          docker exec -u postgres "$CONTAINER" psql -tAc "SHOW ssl"

      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          CAPABILITIES_CONTRACT_TEST_ROOTCERT: ${{ runner.temp }}/server.crt
        run: uv run pytest -q
